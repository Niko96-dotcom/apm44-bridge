name: APM44Bridge
options:
  bundleIdPrefix: com.niko.apm44
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.10"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
targets:
  APM44Bridge:
    type: application
    platform: macOS
    sources:
      - path: APM44Bridge
    dependencies:
      - package: Sparkle
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.niko.apm44.menu
      PRODUCT_MODULE_NAME: APM44Bridge
      PRODUCT_NAME: "APM44 Bridge"
      MARKETING_VERSION: "${APM44_VERSION}"
      CURRENT_PROJECT_VERSION: "${APM44_VERSION}"
      APM44_BUILD_ID: "${APM44_BUILD_ID}"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_FILE: APM44Bridge/Info.plist
      GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: APM44Bridge/APM44Bridge.entitlements
  APM44BridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../tests
        includes:
          - "test_*.swift"
    dependencies:
      - target: APM44Bridge
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.niko.apm44.menu.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/APM44 Bridge.app/Contents/MacOS/APM44 Bridge"
      BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  APM44Bridge:
    build:
      targets:
        APM44Bridge: all
    test:
      targets:
        - APM44BridgeTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
