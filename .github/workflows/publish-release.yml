name: Publish Signed Release

# CI-01: publication uses only the official checkout action and the repository
# scripts. It runs after a signed tag is pushed; no gh-pages branch is used.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed tag to publish (for example v0.12.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    steps:
      - name: Check out signed tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install project tools
        run: brew install xcodegen

      - name: Secret scan
        run: bash scripts/check-secrets.sh

      - name: Require Sparkle signing secret
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "error: SPARKLE_PRIVATE_KEY repository secret is required" >&2
            exit 1
          fi

      - name: Publish gated assets and signed appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APM44_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/publish-release.sh
