name: Verify Published Release

# The maintainer-controlled local release pipeline creates and uploads the
# notarized artifacts. This tag workflow verifies the public, unauthenticated
# downloads after GitHub Pages and Releases propagate; it deliberately does
# not pretend a clean runner has local Apple/Sparkle signing credentials or
# the gated build artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed tag to publish (for example v0.12.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-published-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Check out published tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Secret scan
        run: bash scripts/check-secrets.sh

      - name: Verify public release and Pages appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ "${#SPARKLE_PRIVATE_KEY}" -ne 44 ]]; then
            echo "error: SPARKLE_PRIVATE_KEY must be the 44-character base64 Ed25519 key" >&2
            exit 1
          fi
          SPARKLE_SIGN_UPDATE="$(bash scripts/ensure-sparkle-tools.sh)" \
            bash scripts/verify-published-release.sh
