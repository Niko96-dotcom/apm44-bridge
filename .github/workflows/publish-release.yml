name: Verify Published Release

# The maintainer-controlled local release pipeline creates and uploads the
# notarized artifacts. This publication workflow verifies the public, unauthenticated
# downloads after GitHub Pages and Releases propagate; it deliberately does
# not pretend a clean runner has local Apple/Sparkle signing credentials or
# the gated build artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed tag to verify (for example v0.12.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-published-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Check out verifier revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Check out published tag for the release scan
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          path: published
          fetch-depth: 0
          submodules: recursive

      - name: Secret scan
        run: bash published/scripts/check-secrets.sh

      - name: Verify public release and Pages appcast
        # Signatures are checked against the app's public SUPublicEDKey only;
        # this job never receives the Sparkle private signing key.
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          APM44_RELEASE_VERSION="$RELEASE_VERSION" \
          SPARKLE_SIGN_UPDATE="$PWD/scripts/sparkle-verify.swift" \
            bash scripts/verify-published-release.sh
