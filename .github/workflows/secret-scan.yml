name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "18 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Redacted leak check
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run leak check
        run: bash scripts/check-secrets.sh
