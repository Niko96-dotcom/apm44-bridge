name: Release Verification

# CI-01: release-facing workflow; action trust decision in docs/release.md
# GitHub Actions trust decision: official actions stay tag-pinned for current release candidates;
# see docs/release.md before moving release publication into CI.
# This tag workflow is verification-only. It must not upload unsigned app,
# driver, or daemon bundles as release artifacts.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install tools
        run: brew install xcodegen

      - name: Secret scan
        run: bash scripts/check-secrets.sh

      - name: Prepare submodules
        run: bash scripts/prepare-submodules.sh

      - name: Build unsigned verification only
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          APM44_BUILD_CONFIG=Release \
            APM44_APP_OUTPUT_DIR="$PWD/build/Release" \
            bash scripts/verify-app-build.sh

      - name: Public artifact note
        run: |
          echo "Unsigned verification build passed."
          echo "Do not distribute CI-built app, driver, or daemon bundles."
          echo "Public release artifact must be produced with:"
          echo "  bash scripts/release-all.sh"
