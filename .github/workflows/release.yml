name: Release

# CI-01: release-facing workflow; action trust decision in docs/release.md
# GitHub Actions trust decision: official actions stay tag-pinned for v0.4;
# see docs/release.md before moving more release publication into CI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install tools
        run: brew install xcodegen

      - name: Secret scan
        run: bash scripts/check-secrets.sh

      - name: Prepare submodules
        run: bash scripts/prepare-submodules.sh

      - name: Build Release (unsigned on CI)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target apm44-bridge APM44Bridge
          (cd App && xcodegen generate)
          xcodebuild -project App/APM44Bridge.xcodeproj -scheme APM44Bridge \
            -configuration Release build CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release"
          bash scripts/embed-daemon-in-app.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APM44Bridge-unsigned
          path: |
            build/Release/APM44 Bridge.app
            build/Driver/APM44Bridge.driver
            build/BridgeDaemon/apm44-bridge

      - name: Note
        run: |
          echo "Signed/notarized DMG must be built on a maintainer Mac with AC_NOTARY:"
          echo "  bash scripts/release-all.sh"
