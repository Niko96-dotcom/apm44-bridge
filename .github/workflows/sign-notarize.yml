name: Sign and Notarize Evidence

# CI-01: release-facing signing workflow; action trust decision in docs/release.md
# Manual maintainer signing/notary evidence — requires Apple Developer credentials on the runner.
# This workflow does not publish the public DMG; scripts/release-all.sh remains
# the maintainer-controlled public artifact path unless upload is added later.
# Local path: scripts/sign-release.sh + scripts/notary-dry-run.sh
# GitHub Actions trust decision: official actions stay tag-pinned for current release candidates;
# see docs/release.md before moving more signing/notarization into CI.
on:
  workflow_dispatch:
    inputs:
      notarize:
        description: "Submit to Apple notary service after signing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: sign-notarize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-notarize:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install tools
        run: brew install xcodegen

      - name: Secret scan
        run: bash scripts/check-secrets.sh

      - name: Prepare submodules
        run: bash scripts/prepare-submodules.sh

      - name: Build Release artifacts
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target apm44-bridge APM44Bridge
          (cd App && xcodegen generate)
          xcodebuild -project App/APM44Bridge.xcodeproj \
            -scheme APM44Bridge \
            -configuration Release \
            -derivedDataPath build/app \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
            build \
            CODE_SIGNING_ALLOWED=NO
          APM44_BUILD_CONFIG=Release \
            APM44_APP_OUTPUT_DIR="$PWD/build/Release" \
            bash scripts/verify-app-build.sh

      - name: Sign (requires APPLE_SIGN_ID secret)
        env:
          SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
          APM44_APP_PATH: ${{ github.workspace }}/build/Release/APM44 Bridge.app
        run: |
          if [[ -z "${SIGN_ID:-}" ]]; then
            echo "error: APPLE_SIGN_ID secret is required for manual release signing"
            exit 1
          fi
          bash scripts/embed-daemon-in-app.sh
          bash scripts/sign-release.sh
          bash scripts/codesign-verify-release.sh

      - name: Notarize (requires AC_NOTARY keychain profile on runner)
        if: inputs.notarize == 'true'
        run: |
          if ! xcrun notarytool history --keychain-profile AC_NOTARY 2>/dev/null; then
            echo "error: AC_NOTARY keychain profile is required when notarize=true"
            exit 1
          fi
          bash scripts/notary-dry-run.sh
