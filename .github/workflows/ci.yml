name: CI

# CI-01: release-facing CI workflow; action trust decision in docs/release.md

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install tools
        timeout-minutes: 10
        run: brew install xcodegen

      - name: Secret scan
        timeout-minutes: 5
        run: bash scripts/check-secrets.sh

      - name: Prepare submodules
        timeout-minutes: 5
        run: bash scripts/prepare-submodules.sh

      - name: Configure CMake
        timeout-minutes: 10
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build native targets
        timeout-minutes: 30
        run: cmake --build build --parallel 4

      - name: Native tests
        timeout-minutes: 10
        run: ctest --test-dir build --output-on-failure

      - name: Swift app build
        timeout-minutes: 15
        run: bash scripts/verify-app-build.sh

      - name: Swift unit tests
        timeout-minutes: 15
        run: |
          xcodebuild -project App/APM44Bridge.xcodeproj \
            -scheme APM44Bridge \
            -destination 'platform=macOS' \
            -derivedDataPath build/app \
            test -only-testing:APM44BridgeTests \
            CODE_SIGNING_ALLOWED=NO

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
