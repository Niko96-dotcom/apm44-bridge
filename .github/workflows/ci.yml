name: CI

# CI-01: release-facing CI workflow; action trust decision in docs/release.md

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install tools
        timeout-minutes: 10
        run: brew install xcodegen

      - name: Build and test (scripts/ci.sh)
        timeout-minutes: 50
        run: bash scripts/ci.sh

  sanitizers:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure sanitizer build
        run: |
          cmake -S . -B "build-${{ matrix.sanitizer }}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
            -DAPM44_SANITIZER="${{ matrix.sanitizer }}"

      - name: Build native targets
        run: cmake --build "build-${{ matrix.sanitizer }}" --parallel 4

      - name: Run native tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir "build-${{ matrix.sanitizer }}" --output-on-failure -j2

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
